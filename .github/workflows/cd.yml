name: CD

# Publish only for intentional releases.
# - push tags v*: semver must match pyproject.toml (same as /api/v1/version)
# - workflow_dispatch: rebuild current pyproject version (no override — avoids
#   publishing a tag that disagrees with the package metadata)
# quality job (reusable CI) must pass before the image is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: eugenb0t/mtsd_detector_mlops

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          PYPROJECT_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "${VERSION}" != "${PYPROJECT_VERSION}" ]; then
              echo "::error::Git tag v${VERSION} does not match pyproject.toml version ${PYPROJECT_VERSION}"
              exit 1
            fi
          else
            VERSION="${PYPROJECT_VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure package is public
        # Repo is public; package visibility is separate. Make GHCR pullable
        # without auth so the instructor can docker pull the release tag.
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sS -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/mtsd_detector_mlops/visibility" \
            -d '{"visibility":"public"}' || true
